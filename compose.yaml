name: portal-akademik

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smas_gajah_mada
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.ps1 first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/init-env.ps1 first}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u portal smas_gajah_mada -e "SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    image: ${IMAGE_PREFIX:-portal-akademik}/backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_RELEASE: ${IMAGE_TAG:-local}
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: portal
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.ps1 first}
      DB_NAME: smas_gajah_mada
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.ps1 first}
      JWT_EXPIRES_IN: 8h
      SERVE_FRONTEND: 'false'
      TRUST_PROXY_HOPS: 1
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - uploads:/app/uploads
    networks: [app, data]
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX:-portal-akademik}/frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    networks: [app]

  gateway:
    image: ${IMAGE_PREFIX:-portal-akademik}/gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    networks: [app]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:

networks:
  app:
  data:
    internal: true
