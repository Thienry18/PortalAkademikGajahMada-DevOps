name: CI-CD Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Build, integration test, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check backend and frontend JavaScript
        run: npm run check
      - name: Generate isolated CI configuration
        shell: bash
        run: |
          umask 077
          printf 'DB_PASSWORD=%s\nDB_ROOT_PASSWORD=%s\nJWT_SECRET=%s\nAPP_PORT=8080\nSEED_DEMO_DATA=true\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate Compose and build application images
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Start exactly four healthy services
        run: |
          docker compose up -d --wait --wait-timeout 240
          test "$(docker compose ps --status running --services | wc -l)" -eq 4
      - name: Test frontend, database, login, and role permissions through gateway
        run: npm run test:smoke
      - name: Verify restart retains data and does not duplicate seeding
        shell: bash
        run: |
          node scripts/check-news-persistence.js prepare
          count_users='const {pool}=require("./src/config/db");pool.query("SELECT COUNT(*) AS count FROM users").then(async([r])=>{console.log(r[0].count);await pool.end()}).catch(()=>process.exit(1))'
          before=$(docker compose exec -T backend node -e "$count_users")
          docker compose exec -T backend node database/migrate.js
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 120
          after=$(docker compose exec -T backend node -e "$count_users")
          test "$before" = "$after"
          node scripts/check-news-persistence.js verify
          npm run test:smoke
      - name: Test public updater install, upgrade, data retention, and rollback
        shell: pwsh
        run: ./tests/updater.integration.ps1
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the three tested application images with immutable commit tags
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker compose push backend frontend gateway
      - name: Package the exact tested images for local deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p artifacts
          docker image save "$IMAGE_PREFIX/backend:$IMAGE_TAG" "$IMAGE_PREFIX/frontend:$IMAGE_TAG" "$IMAGE_PREFIX/gateway:$IMAGE_TAG" mysql:8.4 | gzip -1 > artifacts/docker-images.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: tested-docker-images-${{ github.sha }}
          path: artifacts/docker-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Save test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/containers.txt
          docker compose logs --no-color --tail 150 > artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: docker-diagnostics-${{ github.run_id }}
          path: |
            artifacts/containers.txt
            artifacts/compose.log
          retention-days: 7
      - name: Stop disposable CI stack (volumes expire with hosted runner)
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to local Docker Desktop
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, portal-akademik]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PORTAL_DEPLOY_ROOT: 'D:\mikroskil\DevOps\deployments\portal-akademik'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Check Docker Desktop
        shell: powershell
        run: |
          docker info --format '{{.ServerVersion}}'
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop Linux engine is unavailable.' }
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tested-docker-images-${{ github.sha }}
          path: ${{ runner.temp }}/portal-images
      - name: Load the exact images verified by CI, including MySQL
        shell: powershell
        run: |
          docker image load --input (Join-Path $env:RUNNER_TEMP 'portal-images/docker-images.tar.gz')
          if ($LASTEXITCODE -ne 0) { throw 'Loading tested images failed.' }
      - name: Deploy tested commit and verify readiness (rollback on failure)
        shell: powershell
        run: |
          ./scripts/deploy.ps1 -DeploymentRoot $env:PORTAL_DEPLOY_ROOT -ImagePrefix ('ghcr.io/' + '${{ github.repository }}'.ToLowerInvariant()) -ImageTag '${{ github.sha }}' -SkipPull
      - name: Verify deployed frontend and API through gateway
        shell: powershell
        run: |
          $env:BASE_URL = 'http://127.0.0.1:8080'
          node --test '--test-name-pattern=gateway reaches|protected APIs' tests/smoke.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Post-deploy smoke tests failed.' }

  publish-public:
    name: Publish verified stable release to Docker Hub
    needs: [ci, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, portal-akademik]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Publish tested and successfully deployed images, then promote stable
        shell: powershell
        run: |
          ./scripts/publish-public-release.ps1 -Commit '${{ github.sha }}' -Sequence ([Int64]'${{ github.run_id }}' * 100 + [Int64]'${{ github.run_attempt }}')
